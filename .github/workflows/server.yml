name: Server

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/lmc-server/**'
      - 'packages/lmc-wire/**'
      - 'Dockerfile.server'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'scripts/**'
      - 'patches/**'
      - 'deploy/lmc/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/lmc-server/**'
      - 'packages/lmc-wire/**'
      - 'Dockerfile.server'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'scripts/**'
      - 'patches/**'
      - 'deploy/lmc/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Several specs are written against a real database on purpose — a socket
    # that must drop when its login is revoked, the MySQL-specific migration,
    # the v3 message routes. Giving the job a MySQL means they run here the way
    # they run on a maintainer's machine, instead of being skipped or mocked
    # into agreeing with themselves.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-not-a-secret
          MYSQL_DATABASE: lmc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-not-a-secret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: mysql://root:ci-not-a-secret@127.0.0.1:3306/lmc
      # 32 bytes of hex, as lmc/auth.ts requires. A published CI value seals
      # nothing: the database it protects lives and dies with this job.
      LMC_MASTER_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      HANDY_MASTER_SECRET: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build happy-wire
      run: pnpm --filter lmc-wire --fail-if-no-match build

    # `build` is the production typecheck (tsconfig.build.json, specs excluded).
    # This is exactly what Dockerfile.server runs, so a break here is a break there.
    - name: Production typecheck
      run: pnpm --filter lmc-server --fail-if-no-match build

    # The full typecheck additionally covers specs, which reach into happy-app
    # for cross-package contract checks.
    - name: Full typecheck
      run: pnpm --filter lmc-server --fail-if-no-match typecheck

    - name: Apply migrations
      run: pnpm --filter lmc-server --fail-if-no-match exec prisma migrate deploy

    - name: Unit tests
      run: pnpm --filter lmc-server --fail-if-no-match test

  # Builds the image the deployment guide tells people to run, against the
  # database it actually targets, and proves it serves traffic.
  #
  # It used to run two jobs: this one against Postgres, and a standalone image
  # with an embedded PGlite. Both were upstream's shapes. LMC's Prisma provider
  # is mysql, so the standalone image died applying `202609060001_lmc_mysql`
  # ("syntax error at or near `"), and the production job pointed at a Postgres
  # service it can no longer speak to. One job, MySQL, matching deploy/lmc.
  docker-centre:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-not-a-secret
          MYSQL_DATABASE: lmc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-not-a-secret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: mysql://root:ci-not-a-secret@127.0.0.1:3306/lmc
      # 32 bytes of hex, as lmc/auth.ts requires. A published CI value seals
      # nothing: the database it protects lives and dies with this job.
      LMC_MASTER_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      PORT: "4193"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Dockerfile.server bakes the exported web bundle into the image. `up.sh`
    # exports it first; here a placeholder stands in, because what this job
    # proves is that the centre boots and reaches its database — exporting the
    # Expo bundle would add minutes and test a different thing.
    - name: Stand in for the exported web bundle
      run: |
        mkdir -p deploy/lmc/web
        printf '<!doctype html><title>ci</title>' > deploy/lmc/web/index.html

    - name: Build centre image
      run: docker build -t lmc-centre:ci -f Dockerfile.server .

    - name: Apply migrations
      run: |
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -w /repo/packages/lmc-server \
          --entrypoint sh lmc-centre:ci \
          -c '../../node_modules/.bin/prisma migrate deploy'

    - name: Start container
      run: |
        docker run -d --name lmc-centre-ci --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e LMC_MASTER_KEY="$LMC_MASTER_KEY" \
          -e LMC_BIND_HOST=0.0.0.0 \
          -e LMC_WEB_DIR=/srv/web \
          -e PORT="$PORT" \
          -e METRICS_ENABLED=false \
          lmc-centre:ci

    - name: Wait for health
      run: |
        UP=0
        for i in $(seq 1 60); do
          if curl -sf -m 2 "http://127.0.0.1:${PORT}/health" -o /dev/null; then
            UP=1; echo "centre healthy after ${i}s"; break
          fi
          # A no-op CMD exits immediately — fail fast and loudly rather than
          # waiting out the full timeout.
          if [ "$(docker inspect -f '{{.State.Running}}' lmc-centre-ci)" != "true" ]; then
            echo "Error: container exited before becoming healthy"
            echo "exit code: $(docker inspect -f '{{.State.ExitCode}}' lmc-centre-ci)"
            docker logs lmc-centre-ci
            exit 1
          fi
          sleep 1
        done
        if [ "$UP" != "1" ]; then
          echo "Error: centre did not become healthy"
          docker logs lmc-centre-ci
          exit 1
        fi

    - name: Exercise endpoints
      run: |
        echo "--- /health"
        # /health itself runs `SELECT 1` through Prisma, so a green answer here
        # means the query engine and the schema are usable in the image.
        curl -sf -m 5 "http://127.0.0.1:${PORT}/health"; echo
        echo "--- the web bundle is served"
        curl -sf -m 5 "http://127.0.0.1:${PORT}/" | grep -q '<title>' || {
          echo "Error: the centre did not serve LMC_WEB_DIR"
          exit 1
        }

    - name: Container logs
      if: always()
      run: docker logs lmc-centre-ci || true

    - name: Stop container
      if: always()
      run: docker rm -f lmc-centre-ci || true
