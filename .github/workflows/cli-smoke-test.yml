name: CLI Smoke Test

# Proves the published CLI actually runs from a tarball on a clean machine:
# pack it, install it globally, and drive the commands that must work before a
# device agent can do anything at all.
#
# It no longer starts a server. Upstream shipped a bundled self-host server that
# `happy server` booted; LMC deploys a centre from `deploy/lmc/compose.yaml`
# against its own MySQL, and that path is covered by the Server workflow. What
# is left here is the one thing worth asserting about the subcommand: it points
# at the deployment docs instead of pretending to start something.

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/lmc-cli/**'
      - 'packages/lmc-wire/**'
      - '.github/workflows/cli-smoke-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/lmc-cli/**'
      - 'packages/lmc-wire/**'
      - '.github/workflows/cli-smoke-test.yml'
  workflow_dispatch:

jobs:
  smoke-test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the documented minimum (README says 22.18+); 24 is what the
        # maintainers run. Node 20 was dropped when the runners deprecated it.
        node-version: [22, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: |
        pnpm --filter lmc-wire --fail-if-no-match build
        pnpm --filter link-my-cli --fail-if-no-match build

    - name: Pack packages
      run: |
        pnpm --filter lmc-wire --fail-if-no-match pack --pack-destination packages/lmc-wire
        pnpm --filter link-my-cli --fail-if-no-match pack --pack-destination packages/lmc-cli

    - name: Install packed packages globally
      run: |
        WIRE_PACKAGE_FILE=$(ls packages/lmc-wire/*.tgz)
        CLI_PACKAGE_FILE=$(ls packages/lmc-cli/*.tgz)
        npm install -g "./$WIRE_PACKAGE_FILE" "./$CLI_PACKAGE_FILE"

    - name: Test binary execution
      run: |
        echo "Testing lmc --help..."
        timeout 30s lmc --help || { echo "Error: lmc --help failed or timed out"; exit 1; }

        echo "Testing lmc --version..."
        timeout 10s lmc --version || { echo "Error: lmc --version failed or timed out"; exit 1; }

        echo "Testing lmc doctor..."
        timeout 30s lmc doctor || { echo "Error: lmc doctor failed or timed out"; exit 1; }

        echo "Testing lmc daemon status..."
        timeout 10s lmc daemon status || { echo "Error: lmc daemon status failed or timed out"; exit 1; }

        echo "Binary smoke test passed on Linux!"

    - name: Server subcommand points at the deployment docs
      run: |
        OUT=$(timeout 10s lmc server 2>&1) || { echo "Error: lmc server exited non-zero"; exit 1; }
        echo "$OUT"
        echo "$OUT" | grep -q 'deploy/lmc/README.md' || {
          echo "Error: lmc server no longer names the deployment guide"
          exit 1
        }

  smoke-test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    # Git Bash rather than cmd: the same commands as the Linux job, instead of
    # a second copy of them written in batch that drifted out of date silently
    # (it kept globbing the pre-rename packages/happy-* directories, installed
    # nothing, and still reported success for a while).
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: |
        pnpm --filter lmc-wire --fail-if-no-match build
        pnpm --filter link-my-cli --fail-if-no-match build

    - name: Pack packages
      run: |
        pnpm --filter lmc-wire --fail-if-no-match pack --pack-destination packages/lmc-wire
        pnpm --filter link-my-cli --fail-if-no-match pack --pack-destination packages/lmc-cli

    - name: Install packed packages globally
      run: |
        WIRE_PACKAGE_FILE=$(ls packages/lmc-wire/*.tgz)
        CLI_PACKAGE_FILE=$(ls packages/lmc-cli/*.tgz)
        npm install -g "$WIRE_PACKAGE_FILE" "$CLI_PACKAGE_FILE"

    - name: Test binary execution
      run: |
        lmc --version
        lmc --help
        lmc doctor
        lmc daemon status
        echo "Smoke test passed on Windows!"

# No macOS job: most contributors develop on macOS, so it is the platform least
# likely to break unnoticed.
